apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  # 01-03 使用 IF NOT EXISTS 確保重複執行不噴錯
  01-product-schema.sql: |
    CREATE TABLE IF NOT EXISTS product
    (
        product_id         INT          NOT NULL PRIMARY KEY AUTO_INCREMENT,
        product_name       VARCHAR(128) NOT NULL,
        category           VARCHAR(32)  NOT NULL,
        image_url          VARCHAR(256) NOT NULL,
        price              INT          NOT NULL,
        stock              INT          NOT NULL,
        description        VARCHAR(1024),
        created_date       TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP,
        last_modified_date TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    );

  02-user-schema.sql: |
    CREATE TABLE IF NOT EXISTS user
    (
        user_id            INT          NOT NULL PRIMARY KEY AUTO_INCREMENT,
        email              VARCHAR(256) NOT NULL UNIQUE KEY,
        password           VARCHAR(256) NOT NULL,
        created_date       TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP,
        last_modified_date TIMESTAMP    NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    );

  03-order-schema.sql: |
    -- order 是關鍵字，加上反引號是專業的做法
    CREATE TABLE IF NOT EXISTS `order`
    (
        order_id           INT       NOT NULL PRIMARY KEY AUTO_INCREMENT,
        user_id            INT       NOT NULL,
        total_amount       INT       NOT NULL,
        created_date       TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        last_modified_date TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS order_item
    (
        order_item_id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,
        order_id      INT NOT NULL,
        product_id    INT NOT NULL,
        quantity      INT NOT NULL,
        amount        INT NOT NULL 
    );
    
  # 04 使用 INSERT IGNORE 避免重複插入相同資料導致 Primary Key 衝突
  04-product-data.sql: |
    INSERT IGNORE INTO product (product_name, category, image_url, price, stock, description, created_date, last_modified_date) 
    VALUES ('蘋果', 'FOOD', 'https://cdn.pixabay.com/photo/2014/02/01/17/28/apple-256261__480.jpg', 20, 10, '這是來自澳洲的蘋果！', '2022-03-01 02:41:28', '2022-03-01 02:41:32');